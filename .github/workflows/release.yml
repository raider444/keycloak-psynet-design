name: Semantic version release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment (latest stable tag, or package.json for first release)
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
permissions:
  contents: read
concurrency:
  group: psynet-semantic-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Select immutable source and next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node --test scripts/release-version.test.mjs
          echo "version=$(node scripts/release-version.mjs "$BUMP")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build-publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      source_sha: ${{ needs.version.outputs.sha }}
  release:
    needs: [version, build-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psynet-keycloak-26
          path: dist_keycloak
      - name: Create verified SemVer tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.build-publish.outputs.image_digest }}
        run: |
          cd dist_keycloak
          sha256sum --check psynet-keycloak-26.jar.sha256
          cd ..
          printf 'Keycloak 26.x: login, account, admin and HTML/text email themes.\n\nImage: `ghcr.io/%s@%s`\n\nSource: `%s`\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST" "$SOURCE_SHA" > release-notes.md
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo 'Release tag already exists; refusing to move it.' >&2
            exit 1
          fi
          gh release create "v$VERSION" --target "$SOURCE_SHA" --title "PsyNet $VERSION" \
            --generate-notes --notes-file release-notes.md \
            dist_keycloak/psynet-keycloak-26.jar dist_keycloak/psynet-keycloak-26.jar.sha256
