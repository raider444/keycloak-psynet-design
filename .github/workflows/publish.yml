name: Build and publish PsyNet theme

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psynet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify theme
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check authentication page UI
        run: npm run check-ui
      - name: Build Keycloak theme JAR
        run: npm run build-keycloak-theme
      - name: Verify JAR and create checksum
        run: python3 scripts/check-jar.py
      - name: Build minimal copy image
        run: docker build --tag psynet-theme:ci .
      - name: Verify non-root copy on a read-only root filesystem
        run: |
          destination="$(mktemp -d)"
          trap 'rm -rf "$destination"' EXIT
          chmod 0777 "$destination"
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --volume "$destination:/target" psynet-theme:ci
          cmp dist_keycloak/psynet-keycloak-26.jar "$destination/psynet-keycloak-26.jar"
          test "$(stat -c '%a' "$destination/psynet-keycloak-26.jar")" = 644
      - name: Upload verified JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: psynet-keycloak-26
          path: |
            dist_keycloak/psynet-keycloak-26.jar
            dist_keycloak/psynet-keycloak-26.jar.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-previews
          path: previews/
          retention-days: 14

  publish:
    name: Publish multi-platform copy image to GHCR
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: psynet-keycloak-26
          path: dist_keycloak
      - name: Verify downloaded artifact
        working-directory: dist_keycloak
        run: sha256sum --check psynet-keycloak-26.jar.sha256
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Record deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          printf '### PsyNet theme image\n\n`%s@%s`\n' "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
